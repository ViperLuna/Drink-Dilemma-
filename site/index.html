<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drink Dilemma</title>
<meta name="description" content="Can't decide what to drink? Answer a few questions or just spin.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>🥤 Drink Dilemma</h1>
  <p class="tag">Can't decide what to drink? Let us do it.</p>

  <section id="quiz" class="card">
    <div id="progress"></div>
    <h2 id="question"></h2>
    <div id="options"></div>
  </section>

  <section id="result" class="card" hidden>
    <div id="emoji"></div>
    <h2 id="name"></h2>
    <p id="why"></p>
    <div class="row">
      <button id="another">Another one</button>
      <button id="restart" class="ghost">Start over</button>
    </div>
  </section>

  <button id="spin" class="ghost wide">🎲 Skip the quiz, just pick for me</button>
</main>
<script src="app.js"></script>
</body>
</html>
